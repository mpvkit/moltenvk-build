name: CI Test

on:
  push:
    branches:
      - ci
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag name (default vulkan version)'
        default: ''

jobs:
  build:
    uses: mpvkit/BuildShared/.github/workflows/build.yml@main
    secrets: inherit
    with:
      version: '${{ github.event.inputs.version }}'
      library: 'vulkan'
      try_run: true
